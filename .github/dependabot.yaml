version: 2
registries:
  npm-github:
    type: npm-registry
    url: https://npm.pkg.github.com
    token: ${{ secrets.READER_TOKEN }}
    # Keep public npm as the default. The @navikt scope uses GitHub Packages
    # via .npmrc file. This is not a fallback registry.
    replaces-base: false
updates:
  # Basic set up for package managers.
  # Maintain GitHub Actions dependencies.
  - package-ecosystem: 'github-actions'
    # Workflow files stored in the default location of `.github/workflows`.
    # Don't need to specify `/.github/workflows`, just use `directory: "/"`.
    directory: '/'
    schedule:
      interval: 'weekly'
      # Check for GitHub Actions updates on Thursdays.
      day: 'thursday'
      time: '06:30'
      timezone: 'Europe/Oslo'
    cooldown:
      default-days: 7
    commit-message:
      prefix: '[github-actions] '
  # Maintain npm dependencies
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'daily'
      time: '06:30'
      timezone: 'Europe/Oslo'
    cooldown:
      default-days: 7
    commit-message:
      prefix: '[npm] '
    groups:
      nav-designsystem-packages:
        patterns:
          - '@navikt/aksel*'
          - '@navikt/ds*'
        update-types:
          - 'minor'
          - 'patch'
      react-packages:
        patterns:
          - 'react'
          - 'react-dom'
          - '@types/react'
          - '@types/react-dom'
        update-types:
          - 'minor'
          - 'patch'
      tailwind-packages:
        patterns:
          - 'tailwindcss'
          - '@tailwindcss/*'
        update-types:
          - 'minor'
          - 'patch'
      # Name of group that also appears in the PR subject
      non-grouped-patch-updates:
        patterns:
          - '*'
        update-types:
          - 'patch'
    # Ensures that package.json is updated along with the lockfile
    versioning-strategy: increase
    open-pull-requests-limit: 15
    registries:
      - npm-github
  - package-ecosystem: 'docker'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'thursday'
      time: '06:00'
      timezone: 'Europe/Oslo'
    cooldown:
      default-days: 7
    commit-message:
      prefix: '[docker] '